name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package production files
        run: |
          mkdir -p dist
          cp app.js package.json dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-kata-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
