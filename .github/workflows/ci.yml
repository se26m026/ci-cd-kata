name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package production files
        run: |
          mkdir -p dist
          zip dist/ci-cd-kata.zip app.js package.json package-lock.json
          unzip -t dist/ci-cd-kata.zip

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-cd-kata
          path: dist/ci-cd-kata.zip
          if-no-files-found: error
